name: Regénérer le dépôt F-Droid

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Force l'utilisation de Node 24 pour nettoyer les avertissements GitHub
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer F-Droid Server
        run: |
          pip install fdroidserver

      - name: Préparer l'environnement et générer l'index
        run: |
          cd fdroid
          # Crée le dossier des métadonnées
          mkdir -p metadata
          # Initialisation automatique corrigée sans prompt
          fdroid init --no-prompt
          # Force la création de l'index à partir de tes APK Windows
          fdroid update --create-metadata

      - name: Configurer Pages
        uses: actions/configure-pages@v4

      - name: Téléverser les fichiers du dépôt
        uses: actions/upload-pages-artifact@v3
        with:
          # On publie le sous-dossier de déploiement qui vient d'être généré par F-Droid
          path: './fdroid/repo'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4