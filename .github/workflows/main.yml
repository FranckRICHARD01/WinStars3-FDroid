name: Regénérer le dépôt F-Droid

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer F-Droid Server
        run: |
          pip install fdroidserver

      - name: Préparer l'environnement et générer l'index
        run: |
          cd fdroid
          mkdir -p metadata
          
          # 1. On initialise le dépôt
          fdroid init --no-prompt
          
          # 2. On écrit la configuration en ajoutant impérativement /repo à la fin de l'URL
          cat << 'EOF' > config.yml
          repo_url: "https://franckrichard01.github.io/WinStars3-FDroid/repo"
          repo_name: "WinStars3 F-Droid Repo"
          repo_icon: "icon.png"
          repo_description: "Dépôt F-Droid officiel pour WinStars3"
          archive_older: 0
          EOF
          
          # 3. Génération de l'index
          fdroid update --create-metadata

      - name: Configurer Pages
        uses: actions/configure-pages@v4

      - name: Téléverser les fichiers du dépôt
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANT : On publie tout le dossier 'fdroid' pour que l'URL /repo soit valide sur le web
          path: './fdroid'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4