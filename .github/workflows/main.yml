name: Regénérer le dépôt F-Droid

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer apksigner et Java (requis pour la signature)
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner openjdk-17-jdk

      - name: Installer F-Droid Server
        run: |
          pip install fdroidserver pyyaml

      - name: Générer l'index du dépôt F-Droid
        run: |
          cd fdroid
          fdroid update --create-metadata

      - name: Configurer Pages
        uses: actions/configure-pages@v4

      - name: Téléverser les fichiers du dépôt
        uses: actions/upload-pages-artifact@v3
        with:
          path: './fdroid'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
