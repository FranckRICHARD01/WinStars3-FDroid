name: Regénérer le dépôt F-Droid

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer F-Droid Server
        run: |
          pip install fdroidserver

      - name: Préparer l'environnement et générer l'index
        run: |
          cd fdroid
          mkdir -p metadata repo

          # Initialiser seulement si config.yml n'existe pas encore
          if [ ! -f config.yml ]; then
            fdroid init --no-prompt
          fi

          # Écraser proprement les valeurs clés dans config.yml
          python3 - <<'EOF'
          import yaml

          with open("config.yml", "r") as f:
              config = yaml.safe_load(f) or {}

          config["repo_name"] = "WinStars 3"
          config["repo_url"] = "https://franckrichard01.github.io/WinStars3-FDroid/repo"
          config["repo_description"] = "F-Droid repository for WinStars 3"

          with open("config.yml", "w") as f:
              yaml.dump(config, f, default_flow_style=False, allow_unicode=True)
          EOF

          fdroid update --create-metadata

      - name: Configurer Pages
        uses: actions/configure-pages@v4

      - name: Téléverser les fichiers du dépôt
        uses: actions/upload-pages-artifact@v3
        with:
          # On publie le dossier global pour garder ton adresse fonctionnelle avec /repo/
          path: './fdroid'

          
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4